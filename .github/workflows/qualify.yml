name: Qualify
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python eng/qualify.py
  native:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r requirements-native.txt
      - run: python eng/qualify.py --native
      - run: python eng/qualify-profile.py --out artifacts/profile-qualification
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('artifacts/profile-qualification/**') != ''
        with:
          name: native-profile-evidence
          path: artifacts/profile-qualification/
